name: price_tracker_app
description: "A cross-platform app to track product prices from URLs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  fl_chart: ^0.66.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.1.2
  workmanager: ^0.5.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
